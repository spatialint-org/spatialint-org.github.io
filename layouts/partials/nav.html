{{- $isDocs := hasPrefix .RelPermalink "/docs/" -}}
{{- $isBlog := hasPrefix .RelPermalink "/blog/" -}}
<header class="site-header">
  <div class="container nav">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="var(--accent)"/>
        <g fill="none" stroke="var(--paper)" stroke-width="1.25">
          <circle cx="16" cy="16" r="8.5"/>
          <path d="M7.5 16h17M16 7.5c2.8 3.6 2.8 13.4 0 17M16 7.5c-2.8 3.6-2.8 13.4 0 17"/>
        </g>
        <circle cx="23" cy="9" r="2.4" fill="var(--accent-2)"/>
      </svg>
      <span class="brand-name">Spatial Intelligence</span>
    </a>

    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav-menu" aria-label="Main">
      <a href="{{ "/docs/" | relURL }}"{{ if $isDocs }} class="active"{{ end }}>Docs</a>
      <a href="{{ "/blog/" | relURL }}"{{ if $isBlog }} class="active"{{ end }}>Blog</a>
      <a class="nav-github" href="{{ site.Params.github }}" target="_blank" rel="noopener" aria-label="GitHub repository">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2.17c-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.7-1.28-1.7-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.05.78 2.12v3.14c0 .31.2.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
        <span>GitHub</span>
      </a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      </button>
      <a class="btn btn-primary btn-sm nav-cta" href="{{ "/docs/getting-started/" | relURL }}">Get started</a>
    </nav>
  </div>
</header>
