{{- $docs := site.GetPage "/docs" -}}
{{- $current := . -}}
<aside class="docs-sidebar">
  <button class="docs-menu-btn" type="button" aria-expanded="false">Documentation menu</button>
  <nav class="docs-nav" aria-label="Documentation">
    <div class="docs-nav-group">
      <a class="docs-nav-title{{ if eq $docs.RelPermalink $current.RelPermalink }} active{{ end }}"
        href="{{ $docs.RelPermalink }}">Overview</a>
    </div>

    {{ range $docs.Pages.ByWeight }}
      {{ if .IsSection }}
        <div class="docs-nav-group">
          <a class="docs-nav-title{{ if eq .RelPermalink $current.RelPermalink }} active{{ end }}"
            href="{{ .RelPermalink }}">{{ .Title }}</a>
          {{ range .RegularPages.ByWeight }}
            <a class="docs-nav-link{{ if eq .RelPermalink $current.RelPermalink }} active{{ end }}"
              href="{{ .RelPermalink }}">{{ .Title }}</a>
          {{ end }}
        </div>
      {{ else }}
        <div class="docs-nav-group">
          <a class="docs-nav-link{{ if eq .RelPermalink $current.RelPermalink }} active{{ end }}"
            href="{{ .RelPermalink }}">{{ .Title }}</a>
        </div>
      {{ end }}
    {{ end }}
  </nav>
</aside>
