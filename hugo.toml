baseURL = "https://spatialint-org.github.io/"
title = "Spatial Intelligence"
locale = "en-us"
defaultContentLanguage = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
summaryLength = 30

[params]
  description = "Spatial Intelligence is a geospatial analysis agent. Ask a question in plain language and get the analysis, a map, and the files behind it."
  tagline = "Turn geospatial questions into maps."
  github = "https://github.com/spatialint-org/spatial-intelligence"
  issues = "https://github.com/spatialint-org/spatial-intelligence/issues"
  author = "Spatial Intelligence"
  ogImage = "/images/og.png"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    codeFences = true
    guessSyntax = true

  [markup.goldmark.renderer]
    unsafe = true

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[minify]
  [minify.tdewolff.html]
    keepWhitespace = false
